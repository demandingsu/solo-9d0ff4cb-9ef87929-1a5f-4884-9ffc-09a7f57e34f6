services:
  radio-archive:
    build: .
    image: radio-archive:1.1.0
    container_name: radio-archive
    ports:
      - "8000:8000"
    volumes:
      - radio-data:/data
    environment:
      RADIO_DB_PATH: /data/radio.db
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/').status==200 else 1)"
      interval: 15s
      timeout: 3s
      start_period: 5s
      retries: 5

volumes:
  radio-data:
